<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
 This file is never shown on its own.
 It holds pieces of HTML that other pages re-use, so we write the
 navbar ONCE instead of copying it into every page.
-->
<body>
 <!-- ===== NAVBAR ===== -->
 <header class="navbar" th:fragment="navbar">
 <nav class="container navbar-inner">
 <a href="#home" class="navbar-logo" th:text="${name}">Your Name</a>
 <!-- the menu button, only visible on small screens -->
 <button class="navbar-toggle" aria-label="Open or close the \
 menu">&#9776;</button>
 <ul class="navbar-links">
 <li><a href="#about">About</a></li>
 <li><a href="#skills">Skills</a></li>
 <li><a href="#projects">Projects</a></li>
 <li><a href="#journey">Journey</a></li>
 <li><a href="#contact">Contact</a></li>
 </ul>
 </nav>
 </header>
</body>
</html>
